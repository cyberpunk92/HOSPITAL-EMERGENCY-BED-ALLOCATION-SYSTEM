{% extends 'base.html' %}
{% block title %}New Admission{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">New Admission</h4>
    <a href="{{ url_for('admissions.list_admissions') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
</div>

<div class="hebas-card p-4" style="max-width: 720px;">
    <form method="post" novalidate>
        <div class="row g-3">
            <div class="col-md-8"><label class="form-label">Patient *</label>
                <select name="patient_id" class="form-select" required>
                    <option value="">Select patient...</option>
                    {% for p in patients %}<option value="{{ p.patient_id }}" {{ 'selected' if form.patient_id == p.patient_id|string }}>{{ p.full_name }} ({{ p.national_id }})</option>{% endfor %}
                </select>
                <div class="form-text">Not listed? <a href="{{ url_for('patients.new') }}">Register a new patient</a> first.</div>
            </div>
            <div class="col-md-4"><label class="form-label">Triage Priority *</label>
                <select name="triage_priority" class="form-select" required>
                    <option value="">—</option>
                    <option value="5" {{ 'selected' if form.triage_priority == '5' }}>5 – Resuscitation</option>
                    <option value="4" {{ 'selected' if form.triage_priority == '4' }}>4 – Emergent</option>
                    <option value="3" {{ 'selected' if form.triage_priority == '3' }}>3 – Urgent</option>
                    <option value="2" {{ 'selected' if form.triage_priority == '2' }}>2 – Less Urgent</option>
                    <option value="1" {{ 'selected' if form.triage_priority == '1' }}>1 – Non-urgent</option>
                </select></div>
            <div class="col-12"><label class="form-label">Chief Complaint *</label>
                <textarea name="chief_complaint" class="form-control" rows="2" required>{{ form.chief_complaint or '' }}</textarea>
                <div class="form-text">A doctor will be auto-suggested if the complaint matches a known mapping.</div></div>
        </div>
        <div class="mt-4"><button class="btn btn-primary"><i class="bi bi-check-lg"></i> Register Admission</button></div>
    </form>
</div>
{% endblock %}
