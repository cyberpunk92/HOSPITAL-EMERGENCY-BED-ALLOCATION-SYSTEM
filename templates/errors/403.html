{% extends 'base.html' %}
{% block title %}Forbidden{% endblock %}
{% block content %}
<div class="hebas-card text-center py-5">
    <i class="bi bi-lock-fill" style="font-size:2.5rem;color:var(--hebas-danger);"></i>
    <h3 class="mt-3">403 &mdash; Access Denied</h3>
    <p class="text-muted">You do not have permission to view this page.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Back to my dashboard</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="hebas-login-wrap"><div class="hebas-login-card text-center">
    <h3>403 &mdash; Access Denied</h3>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-3">Sign in</a>
</div></div>
{% endblock %}
