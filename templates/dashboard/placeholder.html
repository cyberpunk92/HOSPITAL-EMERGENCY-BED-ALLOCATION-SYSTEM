{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="hebas-card text-center py-5">
    <i class="bi bi-cone-striped" style="font-size:2.5rem;color:var(--hebas-accent);"></i>
    <h3 class="mt-3">{{ page_title }}</h3>
    <p class="text-muted">This module is part of <strong>{{ phase }}</strong> and is being built next.</p>
    <p class="text-muted mb-0">Signed in as <strong>{{ user.name }}</strong> &mdash; {{ user.primary_role }}</p>
</div>
{% endblock %}
