{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="hebas-card text-center py-5">
    <i class="bi bi-shield-exclamation" style="font-size:2.5rem;color:var(--hebas-warning);"></i>
    <h3 class="mt-3">No role assigned</h3>
    <p class="text-muted">Your account has no role yet. Contact an administrator to be assigned a role.</p>
    <p class="text-muted mb-0">Signed in as <strong>{{ user.name }}</strong> ({{ user.email }})</p>
</div>
{% endblock %}
